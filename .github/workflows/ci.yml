name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests et builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --console=plain

      - name: Build web
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon --console=plain

      - name: Build Android
        run: ./gradlew :composeApp:assembleDebug --no-daemon --console=plain
